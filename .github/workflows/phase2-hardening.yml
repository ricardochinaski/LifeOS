name: Phase 2 hardening

on:
  push:
    branches: [agent/phase2-data-sync]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-data-sync
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply sync hardening
        run: python3 scripts/phase2_hardening_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Automated tests
        run: npx --no-install tsx --test tests/**/*.test.ts

      - name: TypeScript validation
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden phase 2 sync reconciliation"
          git push origin HEAD:agent/phase2-data-sync
