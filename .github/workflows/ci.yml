name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate patched lockfile
        run: npm audit fix --package-lock-only

      - name: Persist patched lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already secure"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: patch vulnerable transitive dependencies"
          git push origin HEAD:${{ github.head_ref }}

      - name: Reinstall patched dependency graph
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript validation
        run: npm run lint

      - name: Build
        run: npm run build
