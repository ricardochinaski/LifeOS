name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate patched lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall patched dependency graph
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript validation
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Export patched lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
