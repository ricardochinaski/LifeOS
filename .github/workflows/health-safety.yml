name: Health safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.ts'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/health-safety.yml'

permissions:
  contents: read

jobs:
  health-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health safety tests
        run: npx --no-install tsx --test tests/**/*.test.ts
