name: Phase 2 apply

on:
  push:
    branches: [agent/phase2-data-sync]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-data-sync
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase 2 migration
        run: |
          if [ -f scripts/phase2_patch.py ]; then
            python3 scripts/phase2_patch.py
          fi

      - name: Install dependencies
        run: npm ci

      - name: Automated tests
        run: npx --no-install tsx --test tests/**/*.test.ts

      - name: TypeScript validation
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit remaining UTC date-only conversions
        run: |
          if grep -R "toISOString().split('T')" src --include='*.ts' --include='*.tsx'; then
            echo "Remaining UTC date-only conversions found"
          else
            echo "No UTC date-only conversions remain in src"
          fi

      - name: Commit Phase 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete phase 2 data sync hardening"
          git push origin HEAD:agent/phase2-data-sync
